<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle</title>
    <link rel="stylesheet" href="triangle.css">
</head>
<body>
    <header>
        <div class="head">
            <div class="name">
                <h1 title="Welcome to Triangle area founder 😊">Triangle Area</h1>
            </div>    
            <div class="btn">
                <button id="homepage">Return to home page</button>
            </div>
        </div>
    </header>
    <div class="divison"></div>

    <main>
        <div class="container">
            <div class="text">
                <h2>Select the property to find the area of triangle :-</h2>
            </div>
            <div class="btn-continue">
                <button class="button" id="normal">Normal</button>
                <button class="button" id="isoceles">Isoceles</button>
                <button class="button" id="equilateral">Equilateral</button>
                <button class="button" id="herons-formula">Heron's formula</button>
                <button class="button" id="co-ordinate">Co-ordinate</button>
            </div>
            <div class="answer">
                <h3 id="area"></h3>
            </div>
        </div>
    </main>
    <script src="triangle.js"></script>
</body>
</html>
